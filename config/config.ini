# ==========================================
# Guovin/iptv-api 高清直播源自动维护配置
# 适用场景：GitHub Actions + GitHub Pages 全自动托管
# 生成时间：2026-08-10
# ==========================================

[Settings]
# ---- 核心开关 ----
open_update = True
open_update_time = True
open_use_cache = True
open_history = True

# ---- 采集方式 ----
# requests: 轻量快速，适合订阅源聚合（推荐）
# driver: 稳定但慢，适合酒店源/组播源/关键字搜索
open_driver = False

# ---- 源类型开关 ----
# 以下三项需要 driver=True 才生效，requests 模式下保持 False
open_hotel = False
open_multicast = False
open_online_search = False

# ---- 订阅源列表（原料库） ----
# 支持 M3U/TXT 格式，多个用逗号分隔
# 程序会自动去重、验活、测速、筛选高清
subscribe_urls = https://live.zbds.top/tv/iptv4.m3u,https://live.zbds.top/tv/iptv6.m3u,https://tv.iill.top/m3u/Gather,https://live.fanmingming.com/tv/m3u/ipv6.m3u,https://gh.aptv.app/https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u,https://gh.aptv.app/https://raw.githubusercontent.com/YueChan/Live/main/APTV.m3u

# ---- 自定义频道模板 ----
# 只采集模板中列出的频道，避免垃圾频道混入，提升速度和精准度
# 文件路径相对于仓库根目录
source_file = config/channel_template.txt

# ---- 网络协议偏好 ----
# ipv4: 仅IPv4 | ipv6: 仅IPv6 | all: 双栈自动选择
ipv_type = all

# ---- 高清过滤（核心配置） ----
# 开启分辨率检测，只保留高清以上
open_filter_resolution = True
# 最低分辨率：1920x1080 = 1080P，2560x1440 = 2K，3840x2160 = 4K
min_resolution = 1920x1080

# ---- 速率与稳定性过滤 ----
# 开启接口速率检测
open_filter_speed = True
# 每个频道最终保留的接口数量（只保留最快的N个）
output_urls_limit = 3

# ---- 广告与无效源过滤 ----
# 过滤广告循环、无信号、黑屏等无效源
open_filter_ad = True

# ---- 排序与去重 ----
# 按响应速度排序
open_sort = True
# 开启域名去重
open_url_info = True

# ---- EPG 节目单 ----
# 生成结果自带 EPG 链接，APTV 自动显示节目预告
open_epg = True

# ---- 代理设置（国内用户一般不需要） ----
open_proxy = False

# ---- 结果输出 ----
# 生成结果文件名
result_file = result.txt
# 同时生成 M3U 格式
open_m3u = True
# M3U 结果文件名
result_m3u_file = result.m3u

# ---- 页面服务（Docker 模式用，GitHub Actions 可忽略） ----
open_service = False
open_host = True
open_local = True
