[Settings]
; =========================
; 全局功能开关
; =========================

# 开启更新，控制是否执行采集和测速
open_update = True

# 开启未匹配频道分类
open_unmatch_category = False

# 开启无结果频道分类
open_empty_category = False

# 开启显示更新时间
open_update_time = True

# 开启显示接口说明信息（来源、分辨率、协议类型）
open_url_info = True

# 开启 EPG 节目单功能
open_epg = True

# 自动提取订阅源声明的 EPG 地址并合并
open_subscribe_epg = False

# 开启转换生成 m3u 文件类型结果
open_m3u_result = True

# 每个频道最终导出的接口数量
output_urls_limit = 3

# 更新时间显示位置：top 或 bottom
update_time_position = top

# 系统语言
language = zh_CN

; =========================
; 定时执行设置（本地/Docker 模式用，GitHub Actions 忽略）
; =========================

update_mode = interval
update_interval = 12
update_times =
update_startup = True
time_zone = Asia/Shanghai

; =========================
; 结果输出 & 服务配置
; =========================

# 模板文件路径（频道白名单）
source_file = config/demo.txt

# 生成结果文件路径
final_file = output/result.txt

# 开启实时写入结果文件
open_realtime_write = True

# 开启页面服务（Docker 模式用）
open_service = False

# HTTP 服务端口
service_port = 8080

# 公网完整访问地址（GitHub Pages 用，留空则使用 public_scheme + public_domain）
public_url =

# Flask 内部 API 端口
app_port = 5180

# 旧版公网协议
public_scheme = http

# 旧版公网 Host
public_domain = 127.0.0.1

# CDN 代理加速地址
cdn_url =

# HTTP 代理地址
http_proxy =

; =========================
; 数据源总开关
; =========================

# 开启本地源（模板文件 + local.txt）
open_local = True

# 开启订阅源功能
open_subscribe = True

# 自动停用失效地址
open_auto_disable_source = False

; =========================
; 数据源工作模式
; =========================

# 开启使用历史更新结果
open_history = True

# 开启使用 M3U 内含的请求头验证信息
open_headers = True

# 全局请求 User-Agent
user_agent =

; =========================
; 过滤 & 测速设置（核心高清配置）
; =========================

# 开启测速功能
open_speed_test = True

# 测速模式：quick 快速达到目标、full 测试全部候选、manual 仅采集
speed_test_mode = quick

# 开启分辨率过滤（核心：只保留高清以上）
open_filter_resolution = True

# 开启速率过滤
open_filter_speed = True

# 开启广告过滤（过滤无信号/广告循环源）
open_filter_ad = True

# 开启全量测速
open_full_speed_test = False

# 快速测速每个频道的有效结果目标（0 表示跟随 output_urls_limit）
speed_test_target = 0

# 快速测速目标的可读配置名
quick_test_target = 0

# 开启补偿机制（接口不足时补充可能可用的接口）
open_supply = False

# 结果排序维度：speed（速率）、delay（延迟）、resolution（分辨率）
sort_by = resolution,speed

# 接口最小分辨率（核心：1920x1080 = 只保留 1080P 及以上）
min_resolution = 1920x1080

# 接口最大分辨率
max_resolution = 3840x2160

# 接口最小速率（单位 MiB/s）
min_speed = 0.5

# 分辨率与速率映射关系
resolution_speed_map = 1280x720:0.2,1920x1080:0.5,3840x2160:1.0

# 性能模式：auto、powersave、balance、fast
performance_mode = auto

# 测速并发高级覆盖值
speed_test_limit = 0

# 单个接口测速超时时长（秒）
speed_test_timeout = 10

# 测速阶段使用 Host 地址进行过滤
speed_test_filter_host = False

# 查询请求超时时长（秒）
request_timeout = 10

; =========================
; 网络协议 & 地域偏好
; =========================

# 强制认为当前网络支持 IPv6
ipv6_support = False

# 生成结果中接口的协议类型：ipv4、ipv6、all
ipv_type = all

# 接口协议类型偏好：ipv4、ipv6、auto
ipv_type_prefer = auto

# 接口归属地（留空表示不指定）
location =

# 接口运营商（留空表示不指定）
isp =

; =========================
; 结果排序偏好
; =========================

# 结果偏好的接口来源排序：local,subscribe
origin_type_prefer =

; =========================
; 本地源
; =========================

# 结果中偏好的本地源接口数量
local_num = 10

; =========================
; 订阅源
; =========================

# 结果中偏好的订阅源接口数量
subscribe_num = 10

; =========================
; 频道台标
; =========================

# 频道台标库地址
logo_url = https://www.xn--rgv465a.top/tvlogo

# 频道台标文件类型
logo_type = png

# 优先使用订阅源 m3u 中自带的 tvg-logo
open_subscribe_logo = True

; =========================
; RTMP 推流
; =========================

# 开启 RTMP 推流功能
open_rtmp = False

# 旧版 Nginx HTTP 端口
nginx_http_port = 8080

# Nginx RTMP 协议端口
nginx_rtmp_port = 1935

# RTMP 频道接口空闲停止推流超时时长（秒）
rtmp_idle_timeout = 300

# RTMP 推流最大并发数量
rtmp_max_streams = 10

# 推流转码模式：copy、auto
rtmp_transcode_mode = copy
